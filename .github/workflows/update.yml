name: update

# Checks npm daily for new lucide-static and @lucide/lab releases, and opens (or refreshes) a
# pull request that regenerates the libraries from them.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: update

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - run: bun install --frozen-lockfile
      - id: update
        run: bun run update
      # A pull request opened with the workflow's token doesn't trigger check.yml, so check here.
      - if: steps.update.outputs.title
        run: bun run check
      - if: steps.update.outputs.title
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: update-lucide
          delete-branch: true
          commit-message: ${{ steps.update.outputs.title }}
          title: ${{ steps.update.outputs.title }}
          body: ${{ steps.update.outputs.body }}
