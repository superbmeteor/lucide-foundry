name: update

# Checks npm daily for new lucide-static and @lucide/lab releases, and opens (or refreshes) a
# pull request that regenerates the libraries from them.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: update

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - run: bun install --frozen-lockfile
      - id: update
        run: bun run update
      # A pull request opened with the workflow's token doesn't trigger check.yml, so check here.
      - if: steps.update.outputs.title
        run: bun run check
      # Commits the regenerated files to update-lucide on top of the base branch, replacing what was
      # there, then opens the pull request or, if one is already open, refreshes its title and body.
      - if: steps.update.outputs.title
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
          TITLE: ${{ steps.update.outputs.title }}
          BODY: ${{ steps.update.outputs.body }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C update-lucide
          git add -A
          git commit -m "$TITLE"
          git push --force origin update-lucide
          pr=$(gh pr list --head update-lucide --base "$BASE" --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$TITLE" --body "$BODY"
          else
            gh pr create --head update-lucide --base "$BASE" --title "$TITLE" --body "$BODY"
          fi
